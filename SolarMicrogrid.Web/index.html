<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EDF5EF" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/solargrid-logo.svg" />
    <meta
      name="description"
      content="SolarGrid Exchange operations and energy reservation portal"
    />
    <title>SolarGrid Exchange</title>
    <!-- Apply the stored theme before first paint to avoid a wrong-theme flash. -->
    <script>
      (function () {
        var stored = 'system'
        try { stored = localStorage.getItem('solargrid-theme') || 'system' } catch (e) { /* storage blocked */ }
        var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', dark ? '#06120E' : '#EDF5EF')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
