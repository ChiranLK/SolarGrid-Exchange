plugins {
    id 'com.android.application'
}

def configuredApiBaseUrl = providers.gradleProperty('SOLARGRID_API_BASE_URL')
        .orElse(providers.environmentVariable('SOLARGRID_API_BASE_URL'))
        .orElse('')
        .get()
        .trim()
def debugApiBaseUrl = configuredApiBaseUrl ?: 'http://10.0.2.2:5076/api/'
def javaString = { value -> value.replace('\\', '\\\\').replace('"', '\\"') }

android {
    namespace 'com.solargrid.exchange'
    compileSdk 36

    defaultConfig {
        applicationId 'com.solargrid.exchange'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'API_BASE_URL', '"' + javaString(debugApiBaseUrl) + '"'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'API_BASE_URL', '"' + javaString(configuredApiBaseUrl) + '"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

def releaseRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}
if (releaseRequested) {
    if (!configuredApiBaseUrl) {
        throw new GradleException(
                'SOLARGRID_API_BASE_URL is required for Android release builds.')
    }

    def hostedUri
    try {
        hostedUri = new URI(configuredApiBaseUrl)
    } catch (Exception ignored) {
        throw new GradleException(
                'SOLARGRID_API_BASE_URL must be a hosted HTTPS URL ending in /api/.')
    }
    def blockedHosts = ['localhost', '127.0.0.1', '::1', '10.0.2.2']
    if (hostedUri.scheme != 'https' || !hostedUri.host ||
            blockedHosts.contains(hostedUri.host.toLowerCase()) ||
            hostedUri.userInfo || hostedUri.query || hostedUri.fragment ||
            !hostedUri.path.endsWith('/api/')) {
        throw new GradleException(
                'SOLARGRID_API_BASE_URL must be a hosted HTTPS URL ending in /api/.')
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.4'
    implementation 'androidx.navigation:navigation-fragment:2.9.5'
    implementation 'androidx.navigation:navigation-ui:2.9.5'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.camera:camera-camera2:1.6.2'
    implementation 'androidx.camera:camera-lifecycle:1.6.2'
    implementation 'androidx.camera:camera-view:1.6.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
